name: deco

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: deco
      POSTGRES_USER: deco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432" # Only accessible locally — not exposed to internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deco"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (object storage) ─────────────────────────────────────────────────
  #
  # Production object storage for all user media: avatars, stickers, and every
  # message attachment. The API talks to it over the S3 API, so the same code
  # path runs in development and in production.
  #
  # ⚠ BACKUPS: the minio_data volume below is the ONLY copy of every uploaded
  # file. Nothing in this repository backs it up. If the disk holding this
  # volume is lost, every attachment, avatar and sticker in Deco is gone
  # permanently — the database keeps the URLs, not the bytes. A backup
  # strategy for this volume is required before anyone relies on this
  # deployment. See the "Backups" section in README.md.
  #
  # Buckets are created and their policies applied by the API at boot
  # (storage.EnsureBuckets); the API refuses to start if that fails, so there
  # is no manual console step and no window where the private bucket is
  # unprotected.
  minio:
    # Pinned deliberately. `latest` would silently roll the storage server
    # holding every attachment forward on any pull. Resolved from the `latest`
    # tag on 2026-08-27; bump it consciously, not by accident.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      # S3 API and web console, local only — expose the S3 API through the
      # same reverse proxy that fronts api/web if browsers must reach public
      # objects directly, and keep 9001 off the internet entirely.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Go API ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      API_PORT: 8080
      API_ENV: production
      DATABASE_URL: postgres://deco:${POSTGRES_PASSWORD}@postgres:5432/deco
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      DECO_ALLOW_LEGACY_GROUP_KEY_MIGRATION: ${DECO_ALLOW_LEGACY_GROUP_KEY_MIGRATION:-0}
      ALLOWED_ORIGINS: ${APP_URL}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      UPLOAD_ROOT: /uploads
      # ─── Object storage ─────────────────────────────────────────────────
      # The R2_* variables above are unused placeholders; storage is
      # configured only through STORAGE_*.
      #
      # Use `s3` in production after setting browser-reachable public/presign
      # URLs. Private attachment reads use short-lived presigned URLs; legacy
      # local media remains available through the uploads_data mount below.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_PRESIGN_ENDPOINT: ${STORAGE_S3_PRESIGN_ENDPOINT:?set a browser-reachable S3 endpoint}
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      STORAGE_PUBLIC_BUCKET: ${STORAGE_PUBLIC_BUCKET:-deco-public}
      STORAGE_PRIVATE_BUCKET: ${STORAGE_PRIVATE_BUCKET:-deco-private}
      # Browser-reachable origin for the PUBLIC bucket, e.g.
      # https://media.example.com. This value is written onto user and sticker
      # rows, so it must be the public origin, never http://minio:9000.
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL}
      STORAGE_PRESIGN_TTL: ${STORAGE_PRESIGN_TTL:-5m}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      # Legacy on-disk media from before the s3 backend. Kept mounted so old
      # /api/v1/media/* URLs already stored on message rows keep resolving.
      - uploads_data:/uploads

  # ─── Next.js Web ────────────────────────────────────────────────────────────
  web:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${APP_URL}
        NEXT_PUBLIC_WS_URL: ${APP_URL_WS}
        NEXT_PUBLIC_MEDIA_URL: ${STORAGE_S3_PRESIGN_ENDPOINT:?set a browser-reachable S3 endpoint}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${APP_URL}
      NEXT_PUBLIC_WS_URL: ${APP_URL_WS}
      NEXT_PUBLIC_MEDIA_URL: ${STORAGE_S3_PRESIGN_ENDPOINT:?set a browser-reachable S3 endpoint}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  # Holds every uploaded file. Unbacked-up — see the MinIO service above.
  minio_data:
