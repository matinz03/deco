name: CI

on:
  push:
  pull_request:

jobs:
  go:
    name: Go (apps/api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: deco
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: deco_s1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deco"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DECO_TEST_DATABASE_URL: postgres://deco:testpw@127.0.0.1:5432/deco_schema_test?sslmode=disable
      TEST_DATABASE_URL: postgres://deco:testpw@127.0.0.1:5432/deco_s1_test?sslmode=disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Initialize integration database
        working-directory: .
        env:
          PGPASSWORD: testpw
        run: |
          psql -h 127.0.0.1 -U deco -d deco_s1_test -c 'CREATE DATABASE deco_schema_test'
          psql "$DECO_TEST_DATABASE_URL" -f infra/compose/init.sql

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

  node:
    name: Node (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Crypto tests
        run: pnpm --filter @deco/crypto test

      # Lint is DELIBERATELY OMITTED, not skipped for convenience.
      # There is no ESLint in this repo: apps/web's `lint` script is `next lint`,
      # which Next.js 16 removed, and no eslint dependency or config exists.
      # See docs/FEATURE_BACKLOG.md D-9. Re-enable this step only when a real
      # ESLint flat config is in place — do NOT make it pass by aliasing `lint`
      # to another command (that was attempted and rejected: it produces a gate
      # that reports green while enforcing nothing).
      #
      #   - name: Lint
      #     run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
        run: pnpm build --force
