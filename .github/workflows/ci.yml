name: CI

on:
  push:
  pull_request:

jobs:
  go:
    name: Go (apps/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

  node:
    name: Node (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Crypto tests
        run: pnpm --filter @deco/crypto test

      # Lint is DELIBERATELY OMITTED, not skipped for convenience.
      # There is no ESLint in this repo: apps/web's `lint` script is `next lint`,
      # which Next.js 16 removed, and no eslint dependency or config exists.
      # See docs/FEATURE_BACKLOG.md D-9. Re-enable this step only when a real
      # ESLint flat config is in place — do NOT make it pass by aliasing `lint`
      # to another command (that was attempted and rejected: it produces a gate
      # that reports green while enforcing nothing).
      #
      #   - name: Lint
      #     run: pnpm lint

      - name: Type check
        run: pnpm type-check
