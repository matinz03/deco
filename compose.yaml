name: deco

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: deco
      POSTGRES_USER: deco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decosecret123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/compose/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deco"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-decosecret123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-decosecret123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      API_PORT: 8080
      API_ENV: production
      DATABASE_URL: postgres://deco:${POSTGRES_PASSWORD:-decosecret123}@postgres:5432/deco
      REDIS_URL: redis://:${REDIS_PASSWORD:-decosecret123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-decosecretkey1234567890}
      ALLOWED_ORIGINS: ${APP_URL:-https://deco.matinz03.tech}
      UPLOAD_ROOT: /uploads
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads_data:/uploads

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${APP_URL:-https://deco.matinz03.tech}
        NEXT_PUBLIC_WS_URL: ${APP_URL_WS:-wss://deco.matinz03.tech}
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: ${APP_URL:-https://deco.matinz03.tech}
      NEXT_PUBLIC_WS_URL: ${APP_URL_WS:-wss://deco.matinz03.tech}
    ports:
      - "127.0.0.1:${HOST_PORT:-3110}:3000"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
